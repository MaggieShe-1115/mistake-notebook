<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Mistake Notebook</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f6f7fb; color: #1d2233; margin: 0; padding: 32px 16px; }
      main { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; }
      h1 { font-size: 1.4rem; margin-top: 0; }
      a { display: inline-block; margin-top: 16px; background: #4f46e5; color: #fff; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
      .note { color: #5d6478; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset Mistake Notebook's saved copy</h1>
      <p id="status">Working…</p>
      <p class="note">Your notebook (mistakes and pictures) is not touched. Only the saved copy of the app is removed; the next visit downloads the latest version.</p>
      <a href="./">Open Mistake Notebook</a>
    </main>
    <script>
      // The escape if the app ever seems stuck on an old version. This page is never served from the
      // saved copy, so it works even then: it unregisters this app's service worker and deletes its
      // caches. The notebook lives in localStorage and IndexedDB, which this does not touch.
      ;(async () => {
        const status = document.getElementById('status')
        try {
          const here = new URL('./', location.href).href
          const registrations = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : []
          const ours = registrations.filter((registration) => registration.scope === here)
          await Promise.all(ours.map((registration) => registration.unregister()))
          const names = 'caches' in window ? await caches.keys() : []
          const ourCaches = names.filter((name) => name.includes(here) || name.startsWith('reader-'))
          await Promise.all(ourCaches.map((name) => caches.delete(name)))
          status.textContent = `Done. Removed ${ours.length} saved app version${ours.length === 1 ? '' : 's'} and ${ourCaches.length} saved file store${ourCaches.length === 1 ? '' : 's'}.`
        } catch (error) {
          status.textContent = `Couldn't reset: ${error.message}`
        }
      })()
    </script>
  </body>
</html>
